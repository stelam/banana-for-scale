<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout 3: Calculator Style</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /*
      LAYOUT 3: CALCULATOR STYLE
      - Compact, familiar calculator feel
      - Quick-access unit buttons
      - Large display area
      - Efficient for power users
    */
    :root {
      --bg: #1A1A1A;
      --card: #262626;
      --card-light: #333333;
      --text: #FFFFFF;
      --text-secondary: #A3A3A3;
      --text-muted: #737373;
      --accent: #FBBF24;
      --accent-dim: #92400E;
      --border: #404040;
    }
    [data-theme="light"] {
      --bg: #F5F5F5;
      --card: #FFFFFF;
      --card-light: #FAFAFA;
      --text: #171717;
      --text-secondary: #525252;
      --text-muted: #A3A3A3;
      --accent: #F59E0B;
      --accent-dim: #FEF3C7;
      --border: #E5E5E5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .calculator {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    /* Header */
    .calc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .calc-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }
    .calc-title span { color: var(--text-muted); }
    .theme-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--card-light);
      cursor: pointer;
      font-size: 0.875rem;
    }
    /* Type tabs */
    .type-tabs {
      display: flex;
      padding: 0.5rem;
      gap: 0.25rem;
      background: var(--card-light);
    }
    .type-tab {
      flex: 1;
      padding: 0.625rem;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .type-tab.active {
      background: var(--card);
      color: var(--text);
    }
    /* Display */
    .display {
      padding: 1.5rem 1.25rem;
    }
    .display-input {
      margin-bottom: 1rem;
    }
    .display-label {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .display-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    .display-value input {
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      color: inherit;
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
    }
    .display-value input::placeholder { color: var(--text-muted); }
    .display-unit {
      font-size: 1rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    /* Compound */
    .compound-display {
      display: none;
      gap: 0.75rem;
    }
    .compound-display.visible { display: flex; }
    .compound-display .field {
      display: flex;
      align-items: baseline;
    }
    .compound-display input {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      width: 70px;
    }
    .compound-display .suffix {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-left: 0.25rem;
    }
    /* Result */
    .display-result {
      background: var(--accent);
      margin: -1.5rem -1.25rem;
      margin-top: 0;
      padding: 1.25rem;
    }
    .display-result .display-label { color: rgba(0,0,0,0.4); }
    .display-result .display-value { color: #000; }
    .display-result .display-unit { color: rgba(0,0,0,0.6); }
    .result-meta {
      font-size: 0.75rem;
      color: rgba(0,0,0,0.5);
      margin-top: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
    }
    /* Unit buttons */
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      padding: 1rem 1.25rem;
      background: var(--card-light);
    }
    .unit-btn {
      padding: 0.75rem 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .unit-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .unit-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }
    .unit-btn.target {
      background: var(--accent-dim);
      border-color: var(--accent);
    }
    /* Action row */
    .action-row {
      display: flex;
      gap: 0.5rem;
      padding: 0 1.25rem 1.25rem;
      background: var(--card-light);
    }
    .action-btn {
      flex: 1;
      padding: 0.875rem;
      border: none;
      background: var(--card);
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:hover { color: var(--text); }
    .action-btn.primary {
      background: var(--text);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="calc-header">
      <div class="calc-title">Banana <span>for</span> Scale</div>
      <button class="theme-btn" id="themeBtn">☀️</button>
    </div>

    <div class="type-tabs">
      <button class="type-tab active" data-type="length">Length</button>
      <button class="type-tab" data-type="weight">Weight</button>
    </div>

    <div class="display">
      <div class="display-input">
        <div class="display-label">Input</div>
        <div class="display-value" id="inputDisplay">
          <input type="number" id="valueInput" placeholder="0" value="5.92">
          <span class="display-unit" id="fromLabel">ft&in</span>
        </div>
        <div class="compound-display" id="compoundDisplay">
          <div class="field">
            <input type="number" id="feetInput" value="5">
            <span class="suffix">ft</span>
          </div>
          <div class="field">
            <input type="number" id="inchesInput" value="11">
            <span class="suffix">in</span>
          </div>
        </div>
      </div>

      <div class="display-result">
        <div class="display-label">Result</div>
        <div class="display-value">
          <span id="resultValue">10.2</span>
          <span class="display-unit" id="resultUnit">bananas</span>
        </div>
        <div class="result-meta" id="resultMeta">≈ 180.34 cm</div>
      </div>
    </div>

    <div class="unit-grid" id="unitGrid"></div>

    <div class="action-row">
      <button class="action-btn" id="swapBtn">⇄ Swap</button>
      <button class="action-btn" id="clearBtn">Clear</button>
      <button class="action-btn primary" id="copyBtn">Copy</button>
    </div>
  </div>

  <script>
    const BANANA_CM = 17.78, BANANA_G = 118;
    const LENGTH_CM = { bananas: BANANA_CM, inches: 2.54, feet: 30.48, 'feet-inches': 30.48, yards: 91.44, miles: 160934.4, mm: 0.1, cm: 1, m: 100, km: 100000 };
    const WEIGHT_G = { bananas: BANANA_G, oz: 28.3495, lb: 453.592, tons: 907185, g: 1, kg: 1000, 'metric-tons': 1000000 };

    const LENGTH_UNITS = [
      { key: 'bananas', label: '🍌 Banana' },
      { key: 'feet-inches', label: 'ft & in' },
      { key: 'inches', label: 'Inches' },
      { key: 'feet', label: 'Feet' },
      { key: 'cm', label: 'cm' },
      { key: 'm', label: 'Meters' },
      { key: 'mm', label: 'mm' },
      { key: 'km', label: 'km' },
    ];
    const WEIGHT_UNITS = [
      { key: 'bananas', label: '🍌 Banana' },
      { key: 'g', label: 'Grams' },
      { key: 'kg', label: 'kg' },
      { key: 'oz', label: 'Ounces' },
      { key: 'lb', label: 'Pounds' },
      { key: 'tons', label: 'Tons' },
      { key: 'metric-tons', label: 'Metric T' },
    ];

    let convType = 'length', fromUnit = 'feet-inches', toUnit = 'bananas';
    let dark = localStorage.getItem('theme') !== 'light';
    const $ = id => document.getElementById(id);

    function setTheme(d) {
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
      $('themeBtn').textContent = d ? '🌙' : '☀️';
      localStorage.setItem('theme', d ? 'dark' : 'light');
    }
    setTheme(dark);
    $('themeBtn').onclick = () => { dark = !dark; setTheme(dark); };

    document.querySelectorAll('.type-tab').forEach(btn => btn.onclick = () => {
      document.querySelectorAll('.type-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      convType = btn.dataset.type;
      fromUnit = convType === 'length' ? 'feet-inches' : 'kg';
      toUnit = 'bananas';
      renderUnits();
      updateUI();
    });

    function renderUnits() {
      const units = convType === 'length' ? LENGTH_UNITS : WEIGHT_UNITS;
      $('unitGrid').innerHTML = units.map(u =>
        `<button class="unit-btn ${u.key === fromUnit ? 'active' : ''} ${u.key === toUnit ? 'target' : ''}" data-unit="${u.key}">${u.label}</button>`
      ).join('');

      $('unitGrid').querySelectorAll('.unit-btn').forEach(btn => {
        btn.onclick = (e) => {
          if (e.shiftKey || btn.classList.contains('target')) {
            // Set as target
            toUnit = btn.dataset.unit;
            if (toUnit === 'feet-inches') toUnit = 'feet'; // Can't target feet-inches
          } else {
            fromUnit = btn.dataset.unit;
          }
          renderUnits();
          updateUI();
        };
      });
    }

    function updateUI() {
      const isCompound = fromUnit === 'feet-inches';
      $('inputDisplay').style.display = isCompound ? 'none' : 'flex';
      $('compoundDisplay').classList.toggle('visible', isCompound);
      $('fromLabel').textContent = fromUnit === 'feet-inches' ? 'ft&in' : fromUnit;
      convert();
    }

    function convert() {
      let val = fromUnit === 'feet-inches'
        ? (parseFloat($('feetInput').value) || 0) + (parseFloat($('inchesInput').value) || 0) / 12
        : parseFloat($('valueInput').value) || 0;

      let result, meta;
      const table = convType === 'length' ? LENGTH_CM : WEIGHT_G;
      const factor = fromUnit === 'feet-inches' ? table.feet : table[fromUnit];
      const base = val * factor;
      result = base / table[toUnit];
      meta = `≈ ${base.toFixed(2)} ${convType === 'length' ? 'cm' : 'g'}`;

      $('resultValue').textContent = result >= 1e6 ? (result/1e6).toFixed(2)+'M' : result >= 1e3 ? (result/1e3).toFixed(2)+'K' : result < 0.01 && result > 0 ? result.toExponential(2) : result.toFixed(2);
      $('resultUnit').textContent = toUnit;
      $('resultMeta').textContent = meta;
    }

    $('valueInput').oninput = convert;
    $('feetInput').oninput = convert;
    $('inchesInput').oninput = convert;
    $('feetInput').onkeydown = e => { if (e.key === 'Tab' || e.key === 'ArrowRight') { e.preventDefault(); $('inchesInput').focus(); }};

    $('swapBtn').onclick = () => {
      if (fromUnit === 'feet-inches') return;
      [fromUnit, toUnit] = [toUnit, fromUnit];
      renderUnits();
      updateUI();
    };

    $('clearBtn').onclick = () => {
      $('valueInput').value = '';
      $('feetInput').value = '';
      $('inchesInput').value = '';
      convert();
    };

    $('copyBtn').onclick = async () => {
      try {
        await navigator.clipboard.writeText(`${$('resultValue').textContent} ${$('resultUnit').textContent}`);
        $('copyBtn').textContent = '✓ Copied!';
        setTimeout(() => $('copyBtn').textContent = 'Copy', 1500);
      } catch {}
    };

    renderUnits();
    updateUI();
  </script>
</body>
</html>
