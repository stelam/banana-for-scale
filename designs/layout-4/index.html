<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout 4: Inline Sentence</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /*
      LAYOUT 4: INLINE SENTENCE
      - Natural language style
      - "Convert [X] [unit] to [unit]"
      - Feels conversational
      - Great for casual users
    */
    :root {
      --bg: #FFFBEB;
      --card: #FFFFFF;
      --text: #1C1917;
      --text-secondary: #57534E;
      --text-muted: #A8A29E;
      --border: #E7E5E4;
      --accent: #D97706;
      --accent-light: #FEF3C7;
      --input-bg: #FEF3C7;
    }
    [data-theme="dark"] {
      --bg: #1C1917;
      --card: #292524;
      --text: #FAFAF9;
      --text-secondary: #D6D3D1;
      --text-muted: #78716C;
      --border: #44403C;
      --accent: #FBBF24;
      --accent-light: #422006;
      --input-bg: #44403C;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
    }
    .logo {
      font-family: 'Source Serif 4', serif;
      font-size: 1.375rem;
      font-weight: 600;
    }
    .logo span { color: var(--text-muted); font-weight: 400; }
    .header-actions { display: flex; gap: 0.5rem; }
    .type-pill {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      background: var(--card);
      font-family: inherit;
      font-size: 0.8125rem;
      color: var(--text-muted);
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .type-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }
    .theme-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-size: 1rem;
    }
    /* Main */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .sentence-card {
      width: 100%;
      max-width: 700px;
      background: var(--card);
      border-radius: 24px;
      padding: 3rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
    }
    /* Sentence */
    .sentence {
      font-family: 'Source Serif 4', serif;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      line-height: 1.8;
      color: var(--text);
    }
    .sentence-static {
      color: var(--text-secondary);
    }
    .inline-input {
      display: inline-flex;
      align-items: baseline;
      background: var(--input-bg);
      border-radius: 8px;
      padding: 0.25rem 0.5rem;
      margin: 0 0.25rem;
      border-bottom: 2px solid var(--accent);
    }
    .inline-input input {
      font-family: 'Source Serif 4', serif;
      font-size: inherit;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      width: 80px;
      text-align: center;
    }
    .inline-input input::placeholder { color: var(--text-muted); }
    .inline-input .suffix {
      font-size: 0.75em;
      color: var(--text-muted);
      margin-left: 0.125rem;
    }
    .inline-select {
      display: inline-block;
      position: relative;
    }
    .inline-select select {
      font-family: 'Source Serif 4', serif;
      font-size: inherit;
      font-weight: 600;
      color: var(--accent);
      background: transparent;
      border: none;
      border-bottom: 2px dashed var(--accent);
      padding: 0 1.5rem 0 0;
      cursor: pointer;
      appearance: none;
      outline: none;
    }
    .inline-select::after {
      content: '▾';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.6em;
      color: var(--accent);
      pointer-events: none;
    }
    /* Compound inline */
    .compound-inline {
      display: none;
    }
    .compound-inline.visible {
      display: inline-flex;
      gap: 0.25rem;
    }
    /* Result */
    .result-line {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }
    .result-sentence {
      font-family: 'Source Serif 4', serif;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    .result-value {
      font-family: 'Source Serif 4', serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }
    .result-value span {
      color: var(--accent);
    }
    .result-meta {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }
    .result-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }
    .result-btn {
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--border);
      background: var(--card);
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--text-secondary);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .result-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .result-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }
    /* Responsive */
    @media (max-width: 600px) {
      .sentence-card { padding: 2rem 1.5rem; }
      .inline-input input { width: 60px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Banana <span>for</span> Scale</div>
    <div class="header-actions">
      <button class="type-pill active" data-type="length">Length</button>
      <button class="type-pill" data-type="weight">Weight</button>
      <button class="theme-btn" id="themeBtn">☀️</button>
    </div>
  </header>

  <main>
    <div class="sentence-card">
      <p class="sentence">
        <span class="sentence-static">Convert</span>
        <span class="inline-input" id="singleInput">
          <input type="number" id="valueInput" placeholder="0" value="5.92">
        </span>
        <span class="compound-inline" id="compoundInline">
          <span class="inline-input">
            <input type="number" id="feetInput" placeholder="0" value="5">
            <span class="suffix">ft</span>
          </span>
          <span class="inline-input">
            <input type="number" id="inchesInput" placeholder="0" value="11">
            <span class="suffix">in</span>
          </span>
        </span>
        <span class="inline-select">
          <select id="fromUnit"></select>
        </span>
        <span class="sentence-static">to</span>
        <span class="inline-select">
          <select id="toUnit"></select>
        </span>
      </p>

      <div class="result-line">
        <p class="result-sentence">That's equal to</p>
        <p class="result-value">
          <span id="resultNum">10.2</span> <span id="resultUnit">bananas</span>
        </p>
        <p class="result-meta" id="resultMeta">5 ft 11 in ≈ 180 cm</p>
        <div class="result-actions">
          <button class="result-btn" id="swapBtn">⇄ Swap</button>
          <button class="result-btn primary" id="copyBtn">📋 Copy</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const BANANA_CM = 17.78, BANANA_G = 118;
    const LENGTH_CM = { bananas: BANANA_CM, inches: 2.54, feet: 30.48, 'feet-inches': 30.48, yards: 91.44, miles: 160934.4, mm: 0.1, cm: 1, m: 100, km: 100000 };
    const WEIGHT_G = { bananas: BANANA_G, oz: 28.3495, lb: 453.592, tons: 907185, g: 1, kg: 1000, 'metric-tons': 1000000 };
    const LABELS = { bananas: 'bananas', inches: 'inches', feet: 'feet', 'feet-inches': 'feet & inches', yards: 'yards', miles: 'miles', mm: 'millimeters', cm: 'centimeters', m: 'meters', km: 'kilometers', oz: 'ounces', lb: 'pounds', tons: 'tons', g: 'grams', kg: 'kilograms', 'metric-tons': 'metric tons' };

    let convType = 'length', dark = localStorage.getItem('theme') === 'dark';
    const $ = id => document.getElementById(id);

    function setTheme(d) {
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
      $('themeBtn').textContent = d ? '🌙' : '☀️';
      localStorage.setItem('theme', d ? 'dark' : 'light');
    }
    setTheme(dark);
    $('themeBtn').onclick = () => { dark = !dark; setTheme(dark); };

    document.querySelectorAll('.type-pill').forEach(btn => btn.onclick = () => {
      document.querySelectorAll('.type-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      convType = btn.dataset.type;
      populateUnits();
    });

    function populateUnits() {
      const lengthOpts = '<option value="feet-inches">feet & inches</option><option value="bananas">bananas</option><option value="inches">inches</option><option value="feet">feet</option><option value="yards">yards</option><option value="miles">miles</option><option value="mm">millimeters</option><option value="cm">centimeters</option><option value="m">meters</option><option value="km">kilometers</option>';
      const lengthToOpts = '<option value="bananas">bananas</option><option value="inches">inches</option><option value="feet">feet</option><option value="yards">yards</option><option value="miles">miles</option><option value="mm">millimeters</option><option value="cm">centimeters</option><option value="m">meters</option><option value="km">kilometers</option>';
      const weightOpts = '<option value="bananas">bananas</option><option value="oz">ounces</option><option value="lb">pounds</option><option value="tons">tons</option><option value="g">grams</option><option value="kg">kilograms</option><option value="metric-tons">metric tons</option>';
      if (convType === 'length') {
        $('fromUnit').innerHTML = lengthOpts;
        $('toUnit').innerHTML = lengthToOpts;
      } else {
        $('fromUnit').innerHTML = weightOpts;
        $('toUnit').innerHTML = weightOpts;
        $('fromUnit').value = 'kg';
      }
      handleFromChange();
    }

    function handleFromChange() {
      const isCompound = $('fromUnit').value === 'feet-inches';
      $('singleInput').style.display = isCompound ? 'none' : 'inline-flex';
      $('compoundInline').classList.toggle('visible', isCompound);
      convert();
    }
    $('fromUnit').onchange = handleFromChange;
    $('toUnit').onchange = convert;

    function convert() {
      let val = $('fromUnit').value === 'feet-inches'
        ? (parseFloat($('feetInput').value) || 0) + (parseFloat($('inchesInput').value) || 0) / 12
        : parseFloat($('valueInput').value) || 0;

      let result, meta;
      if (convType === 'length') {
        const factor = $('fromUnit').value === 'feet-inches' ? LENGTH_CM.feet : LENGTH_CM[$('fromUnit').value];
        const cm = val * factor;
        result = cm / LENGTH_CM[$('toUnit').value];
        meta = $('fromUnit').value === 'feet-inches'
          ? `${$('feetInput').value || 0} ft ${$('inchesInput').value || 0} in ≈ ${Math.round(cm)} cm`
          : `${val} ${LABELS[$('fromUnit').value]} ≈ ${Math.round(cm)} cm`;
      } else {
        const g = val * WEIGHT_G[$('fromUnit').value];
        result = g / WEIGHT_G[$('toUnit').value];
        meta = `${val} ${LABELS[$('fromUnit').value]} ≈ ${Math.round(g)} g`;
      }
      $('resultNum').textContent = result >= 1e6 ? (result/1e6).toFixed(2)+'M' : result >= 1e3 ? (result/1e3).toFixed(2)+'K' : result < 0.01 && result > 0 ? result.toExponential(2) : result.toFixed(2);
      $('resultUnit').textContent = LABELS[$('toUnit').value];
      $('resultMeta').textContent = meta;
    }

    $('valueInput').oninput = convert;
    $('feetInput').oninput = convert;
    $('inchesInput').oninput = convert;
    $('feetInput').onkeydown = e => { if (e.key === 'Tab') { e.preventDefault(); $('inchesInput').focus(); }};

    $('swapBtn').onclick = () => {
      if ($('fromUnit').value === 'feet-inches') return;
      [$('fromUnit').value, $('toUnit').value] = [$('toUnit').value, $('fromUnit').value];
      handleFromChange();
    };

    $('copyBtn').onclick = async () => {
      try {
        await navigator.clipboard.writeText(`${$('resultNum').textContent} ${$('resultUnit').textContent}`);
        $('copyBtn').textContent = '✓ Copied!';
        setTimeout(() => $('copyBtn').textContent = '📋 Copy', 1500);
      } catch {}
    };

    populateUnits();
  </script>
</body>
</html>
